name: Probe open data portal

# مؤقت: يستكشف واجهة البوابة من خوادم GitHub لتحديد المسارات الصحيحة.
on:
  push:
    branches: [claude/data-gov-sa-api-integration-v4nedt]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe
        run: |
          python - <<'PY'
          import requests, json, re
          H = {"User-Agent": "Mozilla/5.0 (compatible; dashboard-sync/1.0)",
               "Accept": "application/json, text/html;q=0.9, */*"}
          S = requests.Session(); S.headers.update(H)

          def show(label, url, limit=700):
              try:
                  r = S.get(url, timeout=45)
              except Exception as e:
                  print(f"[{label}] {url}\n    EXC {type(e).__name__}: {str(e)[:150]}\n"); return None
              ct = r.headers.get("content-type","")[:60]
              print(f"[{label}] {url}\n    -> {r.status_code} | {ct} | {len(r.content)} bytes")
              body = r.text[:limit].replace("\n"," ")
              print(f"    body: {body}\n")
              return r

          print("=" * 70); print("1. REACHABILITY"); print("=" * 70)
          for host in ["https://open.data.gov.sa/ar/datasets",
                       "https://od.data.gov.sa/ar/datasets",
                       "https://open.data.gov.sa/",
                       "https://od.data.gov.sa/"]:
              show("html", host, 300)

          print("=" * 70); print("2. CANDIDATE API PATHS"); print("=" * 70)
          paths = [
            "/data/api/v1/datasets?version=-1&page=0&size=3",
            "/data/api/datasets?version=-1&page=0&size=3",
            "/api/datasets?page=0&size=3",
            "/data/api/v1/datasets/search?version=-1&query=%D8%A7%D9%84%D9%86%D8%A7%D8%AA%D8%AC&page=0&size=3",
            "/data/api/datasets/search?version=-1&query=%D8%A7%D9%84%D9%86%D8%A7%D8%AA%D8%AC&page=0&size=3",
            "/api/search?q=%D8%A7%D9%84%D9%86%D8%A7%D8%AA%D8%AC",
            "/data/api/organizations?version=-1",
            "/api/v1/datasets",
          ]
          for base in ["https://open.data.gov.sa", "https://od.data.gov.sa"]:
              for p in paths:
                  show("api", base + p, 600)

          print("=" * 70); print("3. LOOK FOR EMBEDDED API HINTS IN THE HTML"); print("=" * 70)
          for host in ["https://open.data.gov.sa/ar/datasets", "https://od.data.gov.sa/ar/datasets"]:
              try:
                  r = S.get(host, timeout=45); html = r.text
              except Exception as e:
                  print(f"{host}: EXC {e}"); continue
              print(f"--- {host} ({len(html)} chars) ---")
              for pat, name in [(r'"[^"]*?/api/[^"]{3,90}"', "api-urls"),
                                (r'https?://[a-z0-9.-]*data\.gov\.sa[^"\'\s<>]{0,80}', "domain-urls"),
                                (r'__NEXT_DATA__|__NUXT__|buildManifest', "framework")]:
                  hits = sorted(set(re.findall(pat, html)))[:15]
                  print(f"  {name}: {hits}")
          PY
